publish_to: 'none'
version: 0.1.17+18

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3+1
  path: ^1.9.0
  http: ^1.2.2
  flutter_secure_storage: 9.2.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3
  flutter_file_dialog: 3.0.2
  uuid: ^4.4.0
